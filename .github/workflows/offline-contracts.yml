name: offline-contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install wheel
        run: |
          python -m pip install build
          python -m build --wheel
          wheel_path=$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')
          pip install "${wheel_path}[dev,mcp]" "geopandas>=0.14" "rasterio>=1.3"
      - name: Test installed wheel contracts outside checkout
        working-directory: /tmp
        run: |
          python -m pytest -o addopts='' -q \
            "$GITHUB_WORKSPACE/tests/test_smoke.py" \
            "$GITHUB_WORKSPACE/tests/test_governance_gates.py" \
            "$GITHUB_WORKSPACE/tests/test_workflow_usgs_e2e.py" \
            "$GITHUB_WORKSPACE/tests/test_mcp_server.py" \
            "$GITHUB_WORKSPACE/tests/test_evidence_schema.py" \
            "$GITHUB_WORKSPACE/tests/test_artifact_store.py" \
            "$GITHUB_WORKSPACE/tests/test_artifact_hashing.py" \
            "$GITHUB_WORKSPACE/tests/test_validation_runner.py" \
            "$GITHUB_WORKSPACE/tests/test_locked_benchmark.py" \
            "$GITHUB_WORKSPACE/tests/test_output_eval.py" \
            "$GITHUB_WORKSPACE/tests/test_solver_wrapper.py" \
            "$GITHUB_WORKSPACE/tests/test_run_swatplus.py" \
            "$GITHUB_WORKSPACE/tests/test_orchestrate.py" \
            "$GITHUB_WORKSPACE/tests/test_calibration_real_engine.py" \
            "$GITHUB_WORKSPACE/tests/test_security_hardening.py" \
            -m 'not slow and not network and not swat_binary'
